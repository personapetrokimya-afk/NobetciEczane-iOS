workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m2

    scripts:
      - name: Clean old build
        script: |
          rm -rf build
          rm -rf Payload
          rm -f NobetciEczane-unsigned.ipa

      - name: Build unsigned app
        script: |
          set -e

          xcodebuild \
            -project NobetciEczane.xcodeproj \
            -scheme NobetciEczane \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Fix Info.plist
        script: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NobetciEczane.app"
          PLIST="$APP_PATH/Info.plist"

          echo "Before fix:"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string NobetciEczane" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable NobetciEczane" \
            "$PLIST"

          echo "After fix:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

      - name: Verify app executable
        script: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NobetciEczane.app"
          PLIST="$APP_PATH/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST")

          echo "CFBundleExecutable = $EXECUTABLE"

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Executable not found!"
            exit 1
          fi

          echo "Executable found:"
          ls -lh "$APP_PATH/$EXECUTABLE"

          echo "Executable type:"
          file "$APP_PATH/$EXECUTABLE"

      - name: Package IPA
        script: |
          set -e

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/NobetciEczane.app \
            Payload/

          /usr/bin/zip -qry \
            NobetciEczane-unsigned.ipa \
            Payload

          echo "IPA created:"
          ls -lh NobetciEczane-unsigned.ipa

          echo "Checking IPA:"
          unzip -l NobetciEczane-unsigned.ipa | head -100

    artifacts:
      - NobetciEczane-unsigned.ipa